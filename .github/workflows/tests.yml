name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  collection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: skills/zwift-segment-hud/requirements.txt
      - run: python -m pip install -r skills/zwift-segment-hud/requirements.txt
      - run: python -m unittest discover -s tests -v
  dashboard:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        skill: [zwift-segment-hud]
    defaults:
      run:
        working-directory: skills/${{ matrix.skill }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: skills/${{ matrix.skill }}/requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
